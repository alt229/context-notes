<dialog id="browser" aria-labelledby="browserTitle">
  <div class="dhead"><h2 id="browserTitle">Choose a film or a folder</h2>
    <button type="button" class="btn quiet" data-close>Close</button></div>
  <div class="dbody">
    <div class="places" id="places"></div>
    <div class="where" id="where"></div>
    <p class="msg bad" id="browseError" hidden></p>
    <ul class="entries" id="entries"></ul>
  </div>
  <div class="dfoot">
    <button type="button" class="btn" id="upBtn">Up one folder</button>
    <button type="button" class="btn primary" id="useFolderBtn">Use this folder</button>
  </div>
</dialog>
