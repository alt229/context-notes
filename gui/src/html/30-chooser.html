  <section class="chooser">
    <label class="big" for="path">Film or folder</label>
    <div class="row">
      <input id="path" type="text" spellcheck="false" autocomplete="off" placeholder="Choose one, or paste its location">
      <button type="button" class="btn local-only" id="pickFile">Choose a film…</button>
      <button type="button" class="btn local-only" id="pickFolder">Choose a folder…</button>
      <button type="button" class="btn quiet" id="browseBtn">Browse here</button>
    </div>
    <label class="check"><input type="checkbox" id="recursive"> Include subfolders (a whole series)</label>
    <p class="hint" id="pathHint" role="status"></p>
  </section>
