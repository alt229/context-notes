<dialog id="tidy" aria-labelledby="tidyTitle">
  <div class="dhead"><h2 id="tidyTitle">Tidy up</h2>
    <button type="button" class="btn quiet" data-close>Close</button></div>
  <div class="dbody">
    <p id="tidyIntro"></p>
    <ul class="entries" id="tidyList"></ul>
    <p class="msg" id="tidyMsg" role="status"></p>
    <div id="tidySubs" hidden>
      <p class="msg bad">Damaged subtitles (nothing was changed; a notes run fetches a clean copy from
        OpenSubtitles.com when Settings allows it):</p>
      <ul class="entries" id="tidySubsList"></ul>
    </div>
  </div>
  <div class="dfoot">
    <button type="button" class="btn" id="tidyNo">Not now</button>
    <button type="button" class="btn primary" id="tidyBtn">Move them</button>
  </div>
</dialog>
